<!doctype html>
<html lang="en" data-bs-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in — Global News Intelligence</title><link rel="stylesheet" href="{{ url_for('static', path='vendor/tabler.min.css') }}"><link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}"></head>
<body class="d-flex flex-column"><main class="page page-center"><div class="container container-tight py-4"><div class="card card-md"><div class="card-body">
<h1 class="h2 text-center mb-3">Sign in to GNI</h1><p class="text-secondary">Use a passkey and verify with your authenticator's PIN, biometric, or device unlock.</p>
<button class="btn btn-primary w-100" id="signin" type="button">Sign in with a passkey</button><div class="alert alert-danger mt-3 d-none" id="error" role="alert"></div>
<div class="text-center mt-3"><a href="/auth/recover">Use a recovery code</a></div>
</div></div></div></main>
<script>
const fromB64 = value => Uint8Array.from(atob(value.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4-value.length%4)%4)), c => c.charCodeAt(0));
const toB64 = value => value===null?null:btoa(String.fromCharCode(...new Uint8Array(value))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const prepGet = o => { o.challenge=fromB64(o.challenge); (o.allowCredentials||[]).forEach(c=>c.id=fromB64(c.id)); return o; };
const serialize = c => ({id:c.id,rawId:toB64(c.rawId),type:c.type,authenticatorAttachment:c.authenticatorAttachment,response:{clientDataJSON:toB64(c.response.clientDataJSON),authenticatorData:toB64(c.response.authenticatorData),signature:toB64(c.response.signature),userHandle:toB64(c.response.userHandle)},clientExtensionResults:c.getClientExtensionResults()});
document.getElementById('signin').addEventListener('click', async () => { const error=document.getElementById('error'); error.classList.add('d-none'); try { const start=await fetch('/auth/webauthn/authentication/options',{method:'POST'}); const data=await start.json(); if(!start.ok) throw new Error(data.error); const credential=await navigator.credentials.get({publicKey:prepGet(data.publicKey)}); const done=await fetch('/auth/webauthn/authentication/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ceremony_id:data.ceremony_id,credential:serialize(credential),next:{{ next_path|tojson }}})}); const result=await done.json(); if(!done.ok) throw new Error(result.error); location.assign(result.next); } catch(e) { error.textContent=e.message||'Passkey authentication failed.'; error.classList.remove('d-none'); }});
</script></body></html>
