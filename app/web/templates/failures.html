{% extends "base.html" %}

{% block title %}

{% block page_header %}

        <div class="page-pretitle">
            Diagnostics
        </div>

        <h2 class="page-title">
            Failing & Degraded Feeds
        </h2>

    </div>
</div>
{% endblock %}


{% block content %}

        <h3 class="card-title">
            Feed Diagnostics
        </h3>
    </div>

    <div hx-get="/web/partials/failing-feeds" hx-trigger="every 60s, pollQueued from:body" hx-swap="innerHTML">
        {% include "partials/failing_feeds_table.html" %}
    </div>

</div>

{% endblock %}
