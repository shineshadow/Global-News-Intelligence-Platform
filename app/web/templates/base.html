<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>
        {% block title %}
        Global News Intelligence
        {% endblock %}
    </title>

    <link rel="stylesheet" href="{{ url_for(
            'static',
            path='vendor/tabler.min.css'
        ) }}">

    <link rel="stylesheet" href="{{ url_for(
            'static',
            path='css/app.css'
        ) }}">

    <script defer src="{{ url_for(
            'static',
            path='vendor/htmx.min.js'
        ) }}"></script>

    <script defer src="{{ url_for(
            'static',
            path='vendor/tabler.min.js'
        ) }}"></script>
</head>

<body>
    <div class="page">

        <header class="navbar navbar-expand-md d-print-none">
            <div class="container-xl">

                <a class="navbar-brand navbar-brand-autodark" href="{{ url_for('web_dashboard') }}">
                    Global News Intelligence
                </a>

                <div class="navbar-nav flex-row order-md-last">
                    <span class="nav-link text-secondary">
                        Operations
                    </span>
                </div>
            </div>
        </header>

        <header class="navbar-expand-md">
            <div class="collapse navbar-collapse show">
                <div class="navbar">
                    <div class="container-xl">
                        <ul class="navbar-nav">

                            <li class="nav-item
                                {% if active_page == 'alerts' %}
                                active
                                {% endif %}
                            ">
                                <a class="nav-link" href="{{ url_for('web_alerts') }}">
                                    Alerts
                                </a>
                            </li>

                            <li class="nav-item
                            {% if active_page == 'dashboard' %}
                            active
                            {% endif %}
                            ">
                                <a class="nav-link" href="{{ url_for('web_dashboard') }}">
                                    Dashboard
                                </a>
                            </li>

                            <li class="nav-item
                            {% if active_page == 'sources' %}
                            active
                            {% endif %}
                            ">
                                <a class="nav-link" href="{{ url_for('web_sources') }}">
                                    Sources
                                </a>
                            </li>

                            <li class="nav-item
                                {% if active_page == 'documents' %}
                                active
                                {% endif %}
                            ">
                                <a class="nav-link" href="{{ url_for('web_documents') }}">
                                    News Feed
                                </a>
                            </li>

                            <li class="nav-item
                                {% if active_page == 'monitors' %}
                                active
                                {% endif %}
                            ">
                                <a class="nav-link" href="{{ url_for('web_monitors') }}">
                                    Monitors
                                </a>
                            </li>

                            <li class="nav-item
                            {% if active_page == 'runs' %}
                            active
                            {% endif %}
                            ">
                                <a class="nav-link" href="{{ url_for('web_runs') }}">
                                    Ingestion Runs
                                </a>
                            </li>

                            <li class="nav-item
                            {% if active_page == 'failures' %}
                            active
                            {% endif %}
                            ">
                                <a class="nav-link" href="{{ url_for('web_failures') }}">
                                    Failures
                                </a>
                            </li>

                        </ul>
                    </div>
                </div>
            </div>
        </header>

        <div class="page-wrapper">

            {% block page_header %}{% endblock %}

            <div class="page-body">
                <div class="container-xl">
                    {% block content %}{% endblock %}
                </div>
            </div>

        </div>
    </div>
</body>

</html>
