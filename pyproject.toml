# To search dev files for depencdencies use:
# grep -rhPHno --color=always --exclude=\*.{git} "(?<=pip install ).*" "." | awk -F: '{print "LN:" $2" - PATH:"$1" - MATCH:"$3}'
# grep -rhPHno --color=always --exclude=\*.{git} "(?<=pip install \).*" "." | awk -F: '{print "LN:" $2" - PATH:"$1" - MATCH:"$3}'

# package.json has npm dependencies

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"


[project]
name = "global-news-intelligence-platform"
version = "0.1.0"
description = "Self-hosted global news monitoring and intelligence platform"

requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "feedparser==6.0.12",
    "celery[redis]==5.6.3",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic",
    "pydantic-settings>=2,<3",
    "redis>=5,<7",
    "httpx",
    "jinja2>=3.1,<4",
]


[project.optional-dependencies]

dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]


[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.ruff]
line-length = 100